name: Сборка и публикация WebAssembly

on:
  push:
    branches: [ "ai-rework" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Компиляция и деплой сайта
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Подтягиваем зависимости (Squirrel)
        run: sh tools/bootstrap-dependencies.sh game

      - name: Устанавливаем компилятор Emscripten SDK (с кэшем)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          cache: true

      - name: Собираем порты Emscripten (SDL2, libpng)
        run: embuilder build sdl2 libpng

      - name: Настраиваем проект (CMake + Ninja + Clang -O3 WASM 2.0)
        run: |
          COMMON_OPT_FLAGS="-O3 -fno-strict-aliasing -msimd128 -mbulk-memory -mnontrapping-fptoint -msign-ext -fno-math-errno -fno-trapping-math -fomit-frame-pointer -DNDEBUG -sUSE_SDL=2 -sUSE_LIBPNG=1"
          LINK_OPT_FLAGS="-O3 -Wl,--gc-sections -msimd128 -mbulk-memory -mnontrapping-fptoint -msign-ext -sUSE_SDL=2 -sUSE_LIBPNG=1 -sUSE_WEBGL2=1 -sFULL_ES3=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sASSERTIONS=0 -sGL_ASSERTIONS=0 -sGL_TRACK_ERRORS=0 -sDISABLE_EXCEPTION_CATCHING=1 -sTEXTDECODER=2 -sEVAL_CTORS=0 -sINITIAL_MEMORY=134217728 -sALLOW_MEMORY_GROWTH=1 -sMAXIMUM_MEMORY=1073741824 -sSTACK_SIZE=2097152 -sASYNCIFY -sASYNCIFY_STACK_SIZE=1048576 -sFORCE_FILESYSTEM=1 -lidbfs.js -sINVOKE_RUN=0 -sENVIRONMENT=web -sEXPORTED_RUNTIME_METHODS=FS,IDBFS,callMain,ccall,cwrap,UTF8ToString,stringToUTF8"
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_AR="$(command -v emar)" \
            -DCMAKE_RANLIB="$(command -v emranlib)" \
            -DDARK_OPENGL_ES=ON \
            -DDARK_EMSCRIPTEN_PORT_INCLUDE="$(em-config CACHE)/sysroot/include" \
            -DCMAKE_CXX_FLAGS="${COMMON_OPT_FLAGS}" \
            -DCMAKE_C_FLAGS="${COMMON_OPT_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${LINK_OPT_FLAGS}"

      - name: Собираем веб-версию
        run: cmake --build build-web -j$(nproc)

      - name: Сохраняем артефакт для отладки
        uses: actions/upload-artifact@v4
        with:
          name: dark-engine-web
          path: build-web/

      - name: Подготавливаем папку сайта
        run: |
          mkdir -p site
          cp build-web/thief-runner.js site/
          cp build-web/thief-runner.wasm site/
          cp web/index.html site/
          ls -lh site/

      - name: Упаковываем сайт для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Публикуем на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
