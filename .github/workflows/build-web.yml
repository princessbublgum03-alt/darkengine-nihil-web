name: Сборка и публикация WebAssembly

on:
  push:
    branches: [ "ai-rework" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Компиляция и деплой сайта
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Подтягиваем зависимости (Squirrel)
        run: sh tools/bootstrap-dependencies.sh game

      - name: Устанавливаем компилятор Emscripten SDK (с кэшем)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          cache: true

      - name: Собираем порты Emscripten (SDL2, libpng)
        run: embuilder build sdl2 libpng

      - name: Настраиваем проект (CMake + Ninja)
        run: |
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDARK_OPENGL_ES=ON \
            -DDARK_EMSCRIPTEN_PORT_INCLUDE="$(em-config CACHE)/sysroot/include" \
            -DCMAKE_CXX_FLAGS="-O3 -sUSE_SDL=2 -sUSE_LIBPNG=1" \
            -DCMAKE_C_FLAGS="-O3 -sUSE_SDL=2 -sUSE_LIBPNG=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-O3 -sUSE_SDL=2 -sUSE_LIBPNG=1 -sFULL_ES3=1 -sASYNCIFY -sASYNCIFY_STACK_SIZE=524288 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 -sINVOKE_RUN=0 -sEXPORTED_RUNTIME_METHODS=FS,callMain"

      - name: Собираем веб-версию
        run: cmake --build build-web -j$(nproc)

      - name: Сохраняем артефакт для отладки
        uses: actions/upload-artifact@v4
        with:
          name: dark-engine-web
          path: build-web/

      - name: Подготавливаем папку сайта
        run: |
          mkdir -p site
          cp build-web/thief-runner.js site/
          cp build-web/thief-runner.wasm site/
          cp web/index.html site/

      - name: Упаковываем сайт для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Публикуем на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
