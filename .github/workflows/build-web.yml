name: Сборка и публикация WebAssembly

on:
  push:
    branches: [ "ai-rework" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Компиляция и деплой сайта
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Подтягиваем зависимости (Squirrel)
        run: sh tools/bootstrap-dependencies.sh game

      - name: Устанавливаем компилятор Emscripten SDK (с кэшем)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          cache: true

      - name: Собираем порты Emscripten (SDL2, libpng)
        run: embuilder build sdl2 libpng

      - name: Патчим преобразования отрицательных float->unsigned углов для WASM (-mnontrapping-fptoint)
        run: |
          python3 - <<'PY'
          import os
          import re
          import pathlib

          # Under WebAssembly -mnontrapping-fptoint, direct float->uint16 (mxs_ang/fixang)
          # emits i32.trunc_sat_f32_u, clamping ANY negative float to 0 instead of
          # wrapping modulo 65536 (which blocks rightward -tz camera rotation).
          CAST_CTX = r'(^|[=(,?:+\-*/%&|^~!<>\[;{]|\breturn)(\s*)'
          INT_GUARD = r'(?!\s*\(\s*(?:signed\s+|unsigned\s+)?(?:int|short|long|sint\d*|int\d+_t|int\d+)\b)'
          EXPR_FOLLOW = r'(?=\(|[-+~]?(?:(?!(?:const|volatile|override|final|noexcept|throw)\b)[A-Za-z_]\w*|\d))'
          RE_EXPLICIT_CAST = re.compile(
              CAST_CTX + r'\(\s*(mxs_ang|fixang)\s*\)\s*' + INT_GUARD + EXPR_FOLLOW
          )
          RE_HEADMOVE_USHORT_CAST = re.compile(
              CAST_CTX + r'\(\s*(ushort|uint16)\s*\)\s*' + INT_GUARD + EXPR_FOLLOW
          )
          RE_STATIC_CAST_START = re.compile(
              r'static_cast\s*<\s*(mxs_ang|fixang)\s*>\s*\('
          )
          RE_MEMBER_COMPOUND = re.compile(
              r'^(\s*)([A-Za-z_]\w*(?:(?:\.|->)[A-Za-z_]\w*)*(?:\.|->)t[xyz])\s*([+-])=\s*([^;]+);(\s*)$'
          )
          RE_MEMBER_ASSIGN = re.compile(
              r'^(\s*)([A-Za-z_]\w*(?:(?:\.|->)[A-Za-z_]\w*)*(?:\.|->)t[xyz])\s*=\s*([^;=]+);(\s*)$'
          )
          RE_ANG_DECL = re.compile(
              r'^(\s*(?:const\s+|static\s+|register\s+)?(mxs_ang|fixang)\s+([A-Za-z_]\w*)\s*=\s*)([^;={}]+);(\s*)$'
          )
          RE_ANG_VAR_DECL = re.compile(r'\b(?:mxs_ang|fixang)\s+([A-Za-z_]\w*)\b')
          RE_ALREADY_INT_CAST = re.compile(
              r'^\s*\(\s*(?:mxs_ang|fixang|unsigned\s+short|ushort)\s*\)\s*\(\s*(?:int|short|long)\s*\)'
          )
          RE_SAFE_CALL = re.compile(r'^\s*(?:mx_rad2ang|mx_deg2ang)\s*\(')
          RE_ARITH_OR_FLOAT = re.compile(r'[\*/+\-]|\d+\.\d*')

          CAMERA_PREFIXES = ('headmove', 'plyr', 'camera', 'phctrl', 'phcore', 'physapi')

          def has_top_level_comma(expr: str) -> bool:
              depth = 0
              for ch in expr:
                  if ch in '([':
                      depth += 1
                  elif ch in ')]':
                      depth = max(0, depth - 1)
                  elif ch == ',' and depth == 0:
                      return True
              return False

          def split_code_and_comment(line: str):
              in_str = None
              esc = False
              for i, ch in enumerate(line):
                  if esc:
                      esc = False
                      continue
                  if in_str:
                      if ch == '\\':
                          esc = True
                      elif ch == in_str:
                          in_str = None
                      continue
                  if ch in ('"', "'"):
                      in_str = ch
                  elif ch == '/' and i + 1 < len(line) and line[i + 1] == '/':
                      return line[:i], line[i:]
              return line, ''

          def rewrite_static_cast(code: str) -> str:
              out = []
              pos = 0
              while True:
                  m = RE_STATIC_CAST_START.search(code, pos)
                  if not m:
                      out.append(code[pos:])
                      break
                  open_idx = m.end() - 1
                  rest = code[open_idx + 1:]
                  if re.match(r'\s*static_cast\s*<\s*(?:int|short|long)\s*>', rest):
                      out.append(code[pos:m.end()])
                      pos = m.end()
                      continue
                  depth = 1
                  i = open_idx + 1
                  while i < len(code) and depth > 0:
                      if code[i] == '(':
                          depth += 1
                      elif code[i] == ')':
                          depth -= 1
                      i += 1
                  if depth != 0:
                      out.append(code[pos:])
                      break
                  close_idx = i - 1
                  inner = code[open_idx + 1:close_idx]
                  out.append(code[pos:open_idx + 1])
                  out.append(f'static_cast<int>({inner})')
                  out.append(')')
                  pos = close_idx + 1
              return ''.join(out)

          def patch_line(line: str, is_camera_file: bool, is_headmove_file: bool, ang_vars: set):
              stripped = line.lstrip()
              if not stripped or stripped.startswith('//') or stripped.startswith('/*') or stripped.startswith('*') or stripped.startswith('#include'):
                  return line
              eol = '\r\n' if line.endswith('\r\n') else ('\n' if line.endswith('\n') else '')
              body = line[:-len(eol)] if eol else line
              code, comment = split_code_and_comment(body)

              # 1. Explicit (mxs_ang)/(fixang) C casts & static_cast<> everywhere in src/ & libsrc/
              code = RE_EXPLICIT_CAST.sub(r'\1\2(\3)(int)', code)
              if is_headmove_file:
                  code = RE_HEADMOVE_USHORT_CAST.sub(r'\1\2(\3)(int)', code)
              if 'static_cast' in code:
                  code = rewrite_static_cast(code)

              # 2. Implicit float->unsigned angle assignments in camera/headmove/player files
              if is_camera_file and not stripped.startswith('#') and not body.rstrip().endswith('\\'):
                  m = RE_MEMBER_COMPOUND.match(code)
                  if m:
                      indent, lhs, op, rhs, tail = m.groups()
                      code = f'{indent}{lhs} = (unsigned short)((int)({lhs}) {op} (int)({rhs.strip()}));{tail}'
                  else:
                      m = RE_ANG_DECL.match(code)
                      if m:
                          prefix, typ, var, rhs, tail = m.groups()
                          rhs_s = rhs.strip()
                          if (not has_top_level_comma(rhs_s)
                                  and not RE_ALREADY_INT_CAST.match(rhs_s)
                                  and not RE_SAFE_CALL.match(rhs_s)
                                  and RE_ARITH_OR_FLOAT.search(rhs_s)):
                              code = f'{prefix}({typ})(int)({rhs_s});{tail}'
                      else:
                          m = RE_MEMBER_ASSIGN.match(code)
                          if m:
                              indent, lhs, rhs, tail = m.groups()
                              rhs_s = rhs.strip()
                              if (not RE_ALREADY_INT_CAST.match(rhs_s)
                                      and not RE_SAFE_CALL.match(rhs_s)
                                      and RE_ARITH_OR_FLOAT.search(rhs_s)):
                                  code = f'{indent}{lhs} = (unsigned short)(int)({rhs_s});{tail}'
                          elif ang_vars:
                              m2 = re.match(r'^(\s*)([A-Za-z_]\w*)\s*([+-])=\s*([^;]+);(\s*)$', code)
                              if m2 and m2.group(2) in ang_vars:
                                  indent, var, op, rhs, tail = m2.groups()
                                  code = f'{indent}{var} = (unsigned short)((int)({var}) {op} (int)({rhs.strip()}));{tail}'

              return code + comment + eol

          total_files = 0
          total_lines = 0
          for root_dir in ('src', 'libsrc'):
              if not os.path.isdir(root_dir):
                  continue
              for dirpath, _, filenames in os.walk(root_dir):
                  for fn in sorted(filenames):
                      if not fn.endswith(('.c', '.cpp', '.h', '.hpp')):
                          continue
                      path = pathlib.Path(dirpath) / fn
                      low = fn.lower()
                      is_headmove = low.startswith('headmove')
                      is_camera = low.startswith(CAMERA_PREFIXES)
                      try:
                          text = path.read_text(encoding='utf-8', errors='surrogateescape')
                      except Exception:
                          continue
                      ang_vars = set(RE_ANG_VAR_DECL.findall(text)) if is_camera else set()
                      lines = text.splitlines(keepends=True)
                      new_lines = []
                      changed_in_file = 0
                      for idx, ln in enumerate(lines, 1):
                          patched = patch_line(ln, is_camera, is_headmove, ang_vars)
                          if patched != ln:
                              changed_in_file += 1
                              if is_camera or changed_in_file <= 5:
                                  print(f'[wasm-ang-fix] {path}:{idx}: {ln.strip()}  ==>  {patched.strip()}')
                          new_lines.append(patched)
                      if changed_in_file:
                          path.write_text(''.join(new_lines), encoding='utf-8', errors='surrogateescape')
                          total_files += 1
                          total_lines += changed_in_file
                      if is_headmove:
                          print(f'--- headmove audit: {path} ---')
                          for idx, ln in enumerate(new_lines, 1):
                              if re.search(r'RelPos|Turn|Gamepad|tz|tx|ty|mxs_ang|fixang|rad|deg|facing|ang', ln, re.I):
                                  print(f'  {idx:4d}: {ln.rstrip()}')
          print(f'[wasm-ang-fix] Patched {total_lines} line(s) across {total_files} file(s).')
          PY

      - name: Кэш FFmpeg 6.1.2 для WebAssembly (ролики Indeo 5 / AVI)
        id: cache-ffmpeg-wasm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-wasm-install
          key: ffmpeg-wasm-6.1.2-v1-${{ runner.os }}

      - name: Собираем статический FFmpeg 6.1.2 для WebAssembly (если нет в кэше)
        if: steps.cache-ffmpeg-wasm.outputs.cache-hit != 'true'
        run: |
          FFMPEG_PREFIX="${{ runner.temp }}/ffmpeg-wasm-install"
          if [ -f "${FFMPEG_PREFIX}/lib/libavformat.a" ] && [ -f "${FFMPEG_PREFIX}/lib/libavcodec.a" ]; then
            echo "FFmpeg WASM already present at ${FFMPEG_PREFIX}"
            exit 0
          fi
          FFMPEG_BUILD="${{ runner.temp }}/ffmpeg-wasm-src"
          rm -rf "${FFMPEG_BUILD}" "${FFMPEG_PREFIX}"
          mkdir -p "${FFMPEG_BUILD}" "${FFMPEG_PREFIX}"
          curl -fsSL https://ffmpeg.org/releases/ffmpeg-6.1.2.tar.xz -o "${FFMPEG_BUILD}/ffmpeg.tar.xz"
          tar -xf "${FFMPEG_BUILD}/ffmpeg.tar.xz" -C "${FFMPEG_BUILD}" --strip-components=1
          cd "${FFMPEG_BUILD}"
          emconfigure ./configure \
            --prefix="${FFMPEG_PREFIX}" \
            --target-os=none \
            --arch=x86_32 \
            --enable-cross-compile \
            --cc=emcc \
            --cxx=em++ \
            --ar=emar \
            --ranlib=emranlib \
            --nm=emnm \
            --extra-cflags="-O3 -msimd128 -mbulk-memory -mnontrapping-fptoint -msign-ext" \
            --disable-everything \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-runtime-cpudetect \
            --disable-autodetect \
            --disable-network \
            --disable-pthreads \
            --disable-w32threads \
            --disable-os2threads \
            --disable-asm \
            --disable-x86asm \
            --disable-inline-asm \
            --disable-stripping \
            --disable-shared \
            --enable-static \
            --enable-avformat \
            --enable-avcodec \
            --enable-avutil \
            --enable-swscale \
            --enable-swresample \
            --enable-protocol=file \
            --enable-demuxer=avi,mov,matroska,ogg,asf \
            --enable-parser=mpeg4video,h264,vp8,vp9,mpegaudio,aac \
            --enable-decoder=indeo5,indeo4,indeo3,indeo2,cinepak,msvideo1,mpeg4,h264,vp8,vp9,theora,pcm_u8,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,adpcm_ms,adpcm_ima_wav,mp3,mp3float,mp2,mp2float,vorbis,aac
          make -j$(nproc)
          make install
          ls -lh "${FFMPEG_PREFIX}/lib"

      - name: Проверяем Asyncify-совместимость unixsrc/movie/movie.cpp для Emscripten
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('unixsrc/movie/movie.cpp')
          if not p.exists():
              print('[movie-audit] unixsrc/movie/movie.cpp not found, skipping')
              raise SystemExit(0)
          text = p.read_text(encoding='utf-8', errors='surrogateescape')
          changed = False
          # Under Emscripten Asyncify, std::this_thread::sleep_for / usleep in
          # movie frame pacing can stall or fail to pump browser audio/video;
          # SDL_Delay routes through Emscripten's Asyncify sleep cleanly.
          if '__EMSCRIPTEN__' not in text and 'sleep_for' in text:
              helper = (
                  '#if defined(__EMSCRIPTEN__)\n'
                  '#include <emscripten.h>\n'
                  '#define DARK_MOVIE_SLEEP_MS(ms) emscripten_sleep((unsigned int)((ms) > 0 ? (ms) : 1))\n'
                  '#endif\n'
              )
              text = helper + text
              text = re.sub(
                  r'std::this_thread::sleep_for\s*\(\s*std::chrono::milliseconds\s*\(([^)]+)\)\s*\)',
                  r'emscripten_sleep((unsigned int)((\1) > 0 ? (\1) : 1))',
                  text
              )
              changed = True
          if changed:
              p.write_text(text, encoding='utf-8', errors='surrogateescape')
              print('[movie-audit] Patched sleep_for in unixsrc/movie/movie.cpp for Emscripten Asyncify')
          else:
              print('[movie-audit] unixsrc/movie/movie.cpp checked (no sleep_for patch needed)')
          PY

      - name: Настраиваем проект (CMake + Ninja + Clang -O3 WASM 2.0 + FFmpeg)
        run: |
          FFMPEG_PREFIX="${{ runner.temp }}/ffmpeg-wasm-install"
          FFMPEG_LIBS="-L${FFMPEG_PREFIX}/lib -lavformat -lavcodec -lswscale -lswresample -lavutil"
          COMMON_OPT_FLAGS="-O3 -fno-strict-aliasing -ffunction-sections -fdata-sections -msimd128 -mbulk-memory -mnontrapping-fptoint -msign-ext -fno-math-errno -fno-trapping-math -fomit-frame-pointer -DNDEBUG -DDARK_HAVE_FFMPEG=1 -I${FFMPEG_PREFIX}/include -sUSE_SDL=2 -sUSE_LIBPNG=1"
          LINK_OPT_FLAGS="-O3 -Wl,--gc-sections -msimd128 -mbulk-memory -mnontrapping-fptoint -msign-ext -sUSE_SDL=2 -sUSE_LIBPNG=1 -lopenal -sUSE_WEBGL2=1 -sFULL_ES3=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sASSERTIONS=0 -sGL_ASSERTIONS=0 -sGL_TRACK_ERRORS=0 -sDISABLE_EXCEPTION_CATCHING=1 -sTEXTDECODER=2 -sEVAL_CTORS=0 -sINITIAL_MEMORY=134217728 -sALLOW_MEMORY_GROWTH=1 -sMAXIMUM_MEMORY=1073741824 -sSTACK_SIZE=2097152 -sASYNCIFY -sASYNCIFY_STACK_SIZE=1048576 -sFORCE_FILESYSTEM=1 -lidbfs.js -sINVOKE_RUN=0 -sENVIRONMENT=web -sEXPORTED_RUNTIME_METHODS=FS,IDBFS,callMain,ccall,cwrap,UTF8ToString,stringToUTF8"
          emcmake cmake -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_AR="$(command -v emar)" \
            -DCMAKE_RANLIB="$(command -v emranlib)" \
            -DDARK_OPENGL_ES=ON \
            -DDARK_EMSCRIPTEN_PORT_INCLUDE="$(em-config CACHE)/sysroot/include" \
            -DCMAKE_CXX_FLAGS="${COMMON_OPT_FLAGS}" \
            -DCMAKE_C_FLAGS="${COMMON_OPT_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${LINK_OPT_FLAGS}" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="${FFMPEG_LIBS}" \
            -DCMAKE_C_STANDARD_LIBRARIES="${FFMPEG_LIBS}"

      - name: Собираем веб-версию
        run: cmake --build build-web -j$(nproc)

      - name: Сохраняем артефакт для отладки
        uses: actions/upload-artifact@v4
        with:
          name: dark-engine-web
          path: build-web/

      - name: Подготавливаем папку сайта
        run: |
          mkdir -p site
          cp build-web/thief-runner.js site/
          cp build-web/thief-runner.wasm site/
          cp web/index.html site/
          ls -lh site/

      - name: Упаковываем сайт для GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Публикуем на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
